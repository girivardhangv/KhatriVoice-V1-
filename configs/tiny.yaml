# KhatriVoice v1 - Tiny Configuration
# Designed for CPU testing (~100K parameters)
# Used to verify the training pipeline works correctly

# Model Architecture
# Note: vocab_size is the maximum vocabulary size. The actual vocab size
# will be determined by the tokenizer during training.
vocab_size: 1000
hidden_size: 64
num_layers: 2
num_attention_heads: 4
num_kv_heads: 4
intermediate_size: 256
max_sequence_length: 128
rope_theta: 10000.0
dropout: 0.0

# Training Parameters
batch_size: 4
gradient_accumulation_steps: 1
learning_rate: 0.001
weight_decay: 0.01
beta1: 0.9
beta2: 0.95
max_grad_norm: 1.0
warmup_steps: 10
max_steps: 100
eval_steps: 20
save_steps: 50
log_steps: 5

# Data Parameters
seed: 42
# Path to training data (text file or directory with .txt files)
# Can be a single text file or a directory containing text files
data_path: data/raw/tiny.txt
# Note: tokenizer_path is not used during training; tokenizer is saved
# to checkpoint_dir/tokenizer automatically

# Checkpointing
checkpoint_dir: checkpoints
resume_from: null

# Device (auto, cpu, cuda)
device: auto
