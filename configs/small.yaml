# KhatriVoice v1 - Small Configuration
# Designed for quick GPU training experiments (~10M parameters)

# Model Architecture
# Note: vocab_size is the maximum vocabulary size. The actual vocab size
# will be determined by the tokenizer during training.
vocab_size: 8000
hidden_size: 256
num_layers: 6
num_attention_heads: 8
num_kv_heads: 4
intermediate_size: 1024
max_sequence_length: 512
rope_theta: 10000.0
dropout: 0.1

# Training Parameters
batch_size: 8
gradient_accumulation_steps: 2
learning_rate: 0.0003
weight_decay: 0.01
beta1: 0.9
beta2: 0.95
max_grad_norm: 1.0
warmup_steps: 100
max_steps: 10000
eval_steps: 500
save_steps: 1000
log_steps: 10

# Data Parameters
seed: 42
# Path to training data (text file or directory with .txt files)
data_path: data/raw/tiny.txt

# Checkpointing
checkpoint_dir: checkpoints
resume_from: null

# Device (auto, cpu, cuda)
device: auto
