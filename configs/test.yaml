# KhatriVoice v1 - Test Configuration
# For small 488 conversation dataset

# Model Architecture (smaller for quick testing)
vocab_size: 8000
hidden_size: 128
num_layers: 4
num_attention_heads: 4
num_kv_heads: 2
intermediate_size: 512
max_sequence_length: 256
rope_theta: 10000.0
dropout: 0.1

# Training Parameters (adjusted for small dataset)
batch_size: 4
gradient_accumulation_steps: 1
learning_rate: 0.001
weight_decay: 0.01
beta1: 0.9
beta2: 0.95
max_grad_norm: 1.0
warmup_steps: 20
max_steps: 200
eval_steps: 20
save_steps: 50
log_steps: 5

# Data Parameters
seed: 42
data_path: data/processed/train_small.txt
tokenizer_path: data/processed/tokenizer

# Checkpointing
checkpoint_dir: checkpoints
resume_from: null

# Device
device: auto
